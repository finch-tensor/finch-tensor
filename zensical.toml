[project]
site_name = "Finch Tensor"
site_url = "https://finch-tensor.org/finch-tensor/"
site_description = "Sparse tensor programming in pure-Python."
copyright = "&copy; 2026 Finch contributors"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/finch-tensor/finch-tensor"
edit_uri = "blob/main/docs/"
nav = [
  { "Introduction" = "index.md" },
  { "Issue Tracker" = "https://github.com/finch-tensor/finch-tensor/issues" },
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.plugins.mkdocstrings]
default_handler = "python"
enable_inventory = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://numpy.org/doc/stable/objects.inv",
    "https://docs.scipy.org/doc/scipy/objects.inv",
]

[project.plugins.mkdocs-autoapi]
autoapi_dir = "src"
autoapi_ignore = [
    "finch/tests/**/*",
]
