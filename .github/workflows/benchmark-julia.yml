name: Julia Benchmark

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark-julia:
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    permissions:
      contents: read # required for actions/checkout
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.0
          environments: benchmark-julia
      - name: Run Julia benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: pixi run benchmark-julia -vvv -m "not slow"
