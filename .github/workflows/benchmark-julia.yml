name: Julia Benchmark

jobs:
  benchmark-julia:
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    permissions:
      contents: read # required for actions/checkout
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.0
          environments: benchmark-julia
      - name: Run Julia benchmarks
        run: pixi run benchmark-julia -vvv -m "not slow"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  # Cancel superseded runs on PR branches; pushes to main get a unique group
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
