name: Publish Docs
on:
  push:
    branches:
      - master
      - main
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          environments: >-
            docs
      - run: |
          pixi run build-docs -- --clean
          touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
          # Keep PR previews deployed by rossjrw/pr-preview-action
          clean-exclude: pr-preview/
          force: false
