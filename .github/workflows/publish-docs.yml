name: Publish Docs
on:
  push:
    branches:
      - master
      - main
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: >-
            docs
      - run: |
          pixi run build-docs -- --clean
          touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: site
          branch: gh-pages
          # Keep PR previews deployed by rossjrw/pr-preview-action
          clean-exclude: pr-preview/
          force: false
