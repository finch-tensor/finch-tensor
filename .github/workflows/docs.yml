name: Docs
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    branches:
      - main
concurrency:
  # Cancel superseded runs on PR branches; pushes to main get a unique group
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.action != 'closed'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: github.event.action != 'closed'
        with:
          pixi-version: v0.84.2
          environments: >-
            docs
      - name: Build Docs
        if: github.event.action != 'closed'
        run: |
          pixi run build-docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event.action != 'closed'
        with:
          name: docs
          path: site/
      # Fork PRs get a read-only token, so they only get the artifact above
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          source-dir: site/
