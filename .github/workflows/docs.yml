name: Docs
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    branches:
      - main
concurrency:
  # Cancel superseded runs on PR branches; pushes to main get a unique group
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        if: github.event.action != 'closed'
        with:
          pixi-version: v0.84.2
          environments: >-
            docs
      - name: Build Docs
        if: github.event.action != 'closed'
        run: |
          pixi run build-docs
      - uses: actions/upload-artifact@v7
        if: github.event.action != 'closed'
        with:
          name: docs
          path: site/
      # Fork PRs get a read-only token, so they only get the artifact above
      - uses: rossjrw/pr-preview-action@v1.8.2
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          source-dir: site/
